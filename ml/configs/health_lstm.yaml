model_id: "MOD-HEALTH-LSTM-001"
name: "Spacecraft Health LSTM Autoencoder"
version: "1.1.0"
architecture: "LSTMAutoencoderNet"
subsystem: "health"
seed: 42

dataset:
  name: "telemetry_physics_esa_structure"
  in_channels: 7
  seq_len: 64
  num_samples: 300
  num_samples_fast: 50

model:
  hidden_dim: 32
  latent_dim: 16

training:
  batch_size: 16
  epochs: 15
  epochs_fast: 3
  lr: 0.003
  weight_decay: 0.0001
  patience: 4
  use_amp: true

export:
  onnx: true
  output_dir: "ml/artifacts/health_lstm"

limitations:
  - "Requires minimum 64-timestep telemetry buffer for inference."
  - "Trained on calibrated nominal ESA-ADB physics envelopes."
