model_id: "MOD-DEBRIS-GRU-001"
name: "Conjunction Sequence Bidirectional GRU Classifier"
version: "1.0.0"
architecture: "DebrisGRUClassifierNet"
subsystem: "debris"
task: "classification"
seed: 42

dataset:
  name: "kelvins_cdm_sequences"
  in_channels: 7
  seq_len: 10
  num_samples: 150
  num_samples_fast: 40

model:
  hidden_dim: 32
  num_layers: 2
  dropout: 0.1

training:
  batch_size: 16
  epochs: 18
  epochs_fast: 4
  lr: 0.005
  weight_decay: 0.0001
  patience: 5
  use_amp: true

export:
  onnx: true
  output_dir: "ml/artifacts/debris_gru"

limitations:
  - "Ingests sequences of up to 10 CDM updates leading to TCA."
  - "Requires normalized CDM features (time_to_tca_hours, miss_distance_m, relative_velocity_ms, c_obs_b, c_obs_t, c_obs_n, log10_pc)."
