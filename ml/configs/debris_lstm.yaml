model_id: "MOD-DEBRIS-LSTM-001"
name: "Conjunction Sequence Bidirectional LSTM Classifier"
version: "1.0.0"
architecture: "DebrisLSTMClassifierNet"
subsystem: "debris"
task: "classification"
seed: 42

dataset:
  name: "kelvins_cdm_sequences"
  in_channels: 7
  seq_len: 10
  num_samples: 150
  num_samples_fast: 40

model:
  hidden_dim: 32
  num_layers: 2
  dropout: 0.1

training:
  batch_size: 16
  epochs: 18
  epochs_fast: 4
  lr: 0.005
  weight_decay: 0.0001
  patience: 5
  use_amp: true

export:
  onnx: true
  output_dir: "ml/artifacts/debris_lstm"

limitations:
  - "Bidirectional LSTM sequence processor."
  - "Captures forward and backward temporal dependencies across CDM updates."
