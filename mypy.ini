[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
exclude = (?x)(
    ^apps/api/alembic/
    | ^\.git/
    | ^node_modules/
    | ^\.next/
  )

[mypy-torch.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-sklearn.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-shap.*]
follow_imports = skip
ignore_missing_imports = True
