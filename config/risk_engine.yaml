# ASTRA-GUARD Mission Risk Engine Configuration
# Architecture §5.4: Fusion weights and thresholds

version: "1.0.0"

fusion:
  # R_safety = 1 - (1 - r_h)(1 - r_d)
  # R_mission = 100 * (weight_safety * R_safety + weight_eo * r_e)
  weight_safety: 0.85
  weight_eo: 0.15

thresholds:
  nominal_max: 25.0
  watch_max: 50.0
  warning_max: 75.0
  critical_min: 75.0

hard_overrides:
  # Pc >= 1e-4 forces CRITICAL level per binding rules
  conjunction_pc_critical: 0.0001
  # Persistent health score >= 0.9 forces WARNING
  health_risk_warning: 0.90
  # Cross-effects: if r_h >= 0.5, EO imaging tasks are flagged "defer/low-power"
  health_degraded_eo_cutoff: 0.50

cooldown_seconds: 300
persistence_window_count: 3
